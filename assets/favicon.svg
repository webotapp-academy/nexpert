<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5C4" />
      <stop offset="100%" stop-color="#00D4AA" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080B10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Black / Dark Background with subtle rounded squircle -->
  <rect width="512" height="512" rx="128" fill="#080B10" stroke="#1E293B" stroke-width="12" />
  
  <!-- Subtle inner shadow & glow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#00D4AA" stroke-width="2" opacity="0.2" />

  <!-- Bold Green 'N' Logo Symbol -->
  <path d="M 148 376 L 148 136 L 212 136 L 308 288 L 308 136 L 364 136 L 364 376 L 300 376 L 204 224 L 204 376 Z" 
