<!DOCTYPE html>
<html>
<head>
    <title>Test AI Insights API</title>
</head>
<body>
    <h1>Test AI Insights API</h1>
    <button onclick="testAPI()">Test API Call</button>
    <div id="result" style="margin-top: 20px; padding: 20px; border: 1px solid #ccc;"></div>
    
    <script>
    async function testAPI() {
        const result = document.getElementById('result');
        result.innerHTML = 'Testing API...';
        
        try {
            const response = await fetch('/name/admin-panel/apis/learner/session-insights.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    action: 'generate_expert_insights',
                    booking_id: '43', // Use a known booking ID
                    force_refresh: '1'
                })
            });
            
            console.log('Response status:', response.status);
            console.log('Response headers:', response.headers);
            
            const text = await response.text();
            console.log('Response text:', text);
            
            let data;
            try {
                data = JSON.parse(text);
            } catch (e) {
                result.innerHTML = `<h3>JSON Parse Error:</h3><pre>${text}</pre>`;
                return;
            }
            
            result.innerHTML = `<h3>API Response:</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            
        } catch (error) {
            console.error('Error:', error);
            result.innerHTML = `<h3>Error:</h3><p>${error.message}</p>`;
        }
    }
    </script>
</body>
</html>
